apiVersion: apps/v1
kind: Deployment
metadata:
  name: moocozin-shoes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: moocozin-shoes
  template:
    metadata:
      labels:
        app: moocozin-shoes
    spec:
      containers:
        - name: moocozin-shoes
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.containerPort }}
